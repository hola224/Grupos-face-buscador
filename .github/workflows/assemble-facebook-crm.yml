name: Assemble Facebook CRM upload

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/assemble-facebook-crm.yml"
      - ".upload_chunks/**"

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble facebook_group_crm.py
        run: |
          set -euo pipefail
          cat .upload_chunks/facebook_group_crm.py.gz.b64.part_* | tr -d '\n' | base64 -d | gzip -dc > facebook_group_crm.py
          test "$(sha256sum facebook_group_crm.py | cut -d ' ' -f1)" = "96f6338abc6aee059f7159fa7295c857d14522fd03012074504202ff6f3f24df"
      - name: Commit assembled file and remove temporary upload files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .upload_chunks .github/workflows/assemble-facebook-crm.yml
          git add facebook_group_crm.py
          git commit -m "Add Facebook group CRM core"
          git push
