name: Assemble Facebook CRM upload

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/assemble-facebook-crm.yml"
      - ".upload_chunks/**"

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble facebook_group_crm.py
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path

          payload = "".join(
              Path(path).read_text(encoding="utf-8").strip()
              for path in sorted(Path(".upload_chunks").glob("facebook_group_crm.py.gz.b64.part_*"))
          )
          # One uploaded chunk lost this character during transfer; keep the repair local to the temporary assembler.
          payload = payload.replace("CaqmjY38kgD+", "CaqmjYQ38kgD+", 1)
          source = gzip.decompress(base64.b64decode(payload))
          digest = hashlib.sha256(source).hexdigest()
          assert digest == "96f6338abc6aee059f7159fa7295c857d14522fd03012074504202ff6f3f24df", digest
          Path("facebook_group_crm.py").write_bytes(source)
          PY
      - name: Commit assembled file and remove temporary upload files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .upload_chunks .github/workflows/assemble-facebook-crm.yml
          git add facebook_group_crm.py
          git commit -m "Add Facebook group CRM core"
          git push
